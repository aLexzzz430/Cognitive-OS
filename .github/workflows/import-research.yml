      - name: Verify and extract packet
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, zipfile
          payload = base64.b64decode(Path('/tmp/research-packet.b64').read_text())
          assert hashlib.sha256(payload).hexdigest() == '2675989be255bea9bd1d24da0d99aca808408082b0eebd68ecb2d01c497ed76d'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              assert len(archive.infolist()) == 78
              for member in archive.infolist():
                  path = PurePosixPath(member.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[:2] == ('research', 'ai_generated_agi_architectures')
                  assert member.file_size < 25 * 1024 * 1024
                  target = Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(member))
          print('Verified archive and extracted 78 reviewed files.')
          PYCODE
          python3 research/ai_generated_agi_architectures/collection/verify.py
